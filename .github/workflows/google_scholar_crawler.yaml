name: Get Citation Data

# Google Scholar blocks GitHub's runner IPs on most days, so the daily refresh
# now runs from the lab server (google_scholar_crawler/update_stats.sh via cron).
# This workflow is kept for manual runs only.
on:
 workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # A successful run takes well under a minute. When Google Scholar serves a
    # captcha, scholarly opens a browser and waits up to a week for a human to
    # solve it, which on CI just burns the 6-hour job limit; cut it short instead.
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v2
    - name: Install Reqs
      run: |
        sudo apt-get install python3-setuptools
    - name: Run
      run: |
        cd ./google_scholar_crawler
        pip3 install -r requirements.txt
        python3 main.py
        cd ./results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
      env: 
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}